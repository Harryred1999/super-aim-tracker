name: Daily AIM Stock Tracker

on:
  schedule:
    # Runs at 17:30 UTC every weekday (Monday to Friday) right after LSE market close
    - cron: '30 17 * * 1-5'
  workflow_dispatch: # Allows you to run it manually whenever you want via a button

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests yahoo_fin

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python tracker.py
