name: AIM Stock Tracker V20 15-Min

on:
  schedule:
    - cron: '*/15 8-17 * * 1-5'
  workflow_dispatch: 

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests pytickersymbols

      - name: Determine Scan Mode
        id: scan-mode
        run: |
          CURRENT_HOUR=$(date -u +%H)
          echo "Current UTC hour: $CURRENT_HOUR"
          if [ "$CURRENT_HOUR" -ge 17 ]; then
            echo "MODE=FULL" >> $GITHUB_OUTPUT
          else
            echo "MODE=INTRADAY" >> $GITHUB_OUTPUT
          fi

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCAN_MODE: ${{ steps.scan-mode.outputs.MODE }}
        run: python tracker.py
