name: AIM Stock Tracker V20 15-Min

on:
  schedule:
    # Runs every 15 mins between 08:00 and 17:45 UTC, Monday through Friday
    - cron: '*/15 8-17 * * 1-5'
  workflow_dispatch: 

permissions:
  contents: write # Needed for stefanzweifel/git-auto-commit-action

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up execution by caching installed wheels

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests pytickersymbols

      - name: Determine Scan Mode
        id: scan-mode
        run: |
          CURRENT_HOUR=$(date -u +%H)
          echo "Current UTC hour: $CURRENT_HOUR"
          # Adjust this threshold if you are tracking London/AIM market hours (UTC vs BST)
          if [ "$CURRENT_HOUR" -ge 17 ]; then
            echo "MODE=FULL" >> $GITHUB_OUTPUT
          else
            echo "MODE=INTRADAY" >> $GITHUB_OUTPUT
          fi

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCAN_MODE: ${{ steps.scan-mode.outputs.MODE }}
        run: python tracker.py

      - name: Commit and Push Performance Logs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Bot] Update algorithmic performance log"
          file_pattern: "*.csv"
